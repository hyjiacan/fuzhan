<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浮栈</title>
    <link rel="stylesheet" href="/assets/icons/filetype/iconfont.css" />
    <script>
      // 首屏渲染前应用已保存/系统的明暗主题，避免闪烁
      ;(function () {
        try {
          var m = localStorage.getItem('theme_mode')
          var dark =
            m === 'dark' ||
            (m !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* 主题预判失败时保持默认浅色 */
        }
      })()
    </script>
    <style>
      /* 首屏加载占位：Vue 挂载后自动被替换 */
      #app {
        height: 100%;
        width: 100%;
      }
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f5f5f5;
        color: #909399;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
      }
      html.dark .app-boot {
        background: #141414;
        color: #6b6b6b;
      }
      .app-boot-logo {
        width: 44px;
        height: 44px;
        animation: app-boot-pulse 1.2s ease-in-out infinite;
      }
      .app-boot-text {
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      @keyframes app-boot-pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.55;
          transform: scale(0.94);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-boot">
        <img class="app-boot-logo" src="/assets/icons/logo.svg" alt="" />
        <span class="app-boot-text">正在加载…</span>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
