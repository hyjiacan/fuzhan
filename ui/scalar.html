<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/logo.svg" />
  <title>API 文档 - 浮栈</title>
  <script>
    // 使用系统配置中的名称作为标题后缀（与主应用一致），失败时保留默认标题
    ;(function () {
      try {
        fetch('/api/v1/web/options', { credentials: 'include' })
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (res) {
            var name = res && res.data && res.data.app && res.data.app.name
            if (name) document.title = 'API 文档 - ' + name
          })
          .catch(function () {})
      } catch (e) {
        /* 忽略：标题保持默认值 */
      }
    })()
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    #scalar-root { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="scalar-root"></div>
  <script type="module" src="/src/scalar-entry.js"></script>
</body>
</html>
